<text x="469.0" y="686" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-style="italic" style="white-space:pre" fill="#374151">implements</text>
<text x="30" y="1070" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" style="white-space:pre" fill="#374151">Visibility:  − private   + public     italics / {abstract} = abstract     underlined = class-level constant     [0..*] = collection, [0..1] = optional (may be none)</text>
<text x="30" y="1092" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" style="white-space:pre" fill="#374151">Relationships:  plain solid line = association     hollow diamond = aggregation (at the whole)     filled diamond = composition (at the whole)</text>
<text x="30" y="1114" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" style="white-space:pre" fill="#374151">solid line + hollow triangle = inheritance (child → parent)     dashed line + hollow triangle = interface realisation</text></svg>