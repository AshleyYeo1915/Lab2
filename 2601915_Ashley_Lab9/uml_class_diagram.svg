<text x="572" y="210" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">0..*</text>
<text x="30" y="830" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#4b5563">Key:   − private   ·   + public   ·   italics / {abstract} = abstract (no implementation)   ·   underlined = class-level constant</text>
<text x="30" y="852" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#4b5563">Solid line + hollow triangle = inheritance (child → parent)   ·   Dashed line + hollow triangle = interface realisation   ·   Hollow diamond = aggregation</text>
